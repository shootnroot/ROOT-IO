<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Machine troubleshooting: 3D model, faults, I/O, sequence, exploded views, cabinet layouts and product defects.">
<meta name="theme-color" content="#1f2a36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Troubleshooter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Troubleshooter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(barlow-semi-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Layout: index rail on the left, 3D stage over a detail sheet on the right; stacks on phones */
:root{
  --bg:#edf0f3; --panel:#f8f9fb; --fg:#1a2129; --muted:#5b6672; --line:#d2d8df; --soft:#e4e8ed;
  --ink:#1f4fb0; --amber:#c46f12; --stop:#b42318; --warn:#9a5a00; --ok:#2f6f3e; --scene:#e3e7eb;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --panel:#171c22; --fg:#e2e7ed; --muted:#94a0ac; --line:#2a323b; --soft:#1f262e;
  --ink:#8aa8ff; --amber:#f0a24a; --stop:#ff7a6b; --warn:#f2b154; --ok:#79c48e; --scene:#151a20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a; --panel:#171c22; --fg:#e2e7ed; --muted:#94a0ac; --line:#2a323b; --soft:#1f262e;
  --ink:#8aa8ff; --amber:#f0a24a; --stop:#ff7a6b; --warn:#f2b154; --ok:#79c48e; --scene:#151a20; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:360px minmax(0,1fr);height:100%;min-height:0}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;flex-direction:column;gap:12px;padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-bottom:1px solid var(--line)}
.idrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.idrow>div{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
.setupbtn{flex:none;font:600 12px var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.mpick{display:flex;align-items:center;gap:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mpick select{flex:1;min-width:0;font:500 14px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 8px;text-transform:none;letter-spacing:0}
.mpick[hidden]{display:none}
.setupbtn:hover,.setupbtn[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.example{font:600 11px var(--f-body);letter-spacing:.04em;color:var(--warn);border:1px solid currentColor;border-radius:3px;padding:2px 6px;align-self:flex-start}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs button{font:600 13px var(--f-body);background:transparent;color:var(--muted);border:0;padding:8px 0;cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--panel)}
input[type=search],input[type=text],select{font:14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 12px var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 8px;cursor:pointer;line-height:1.35;text-align:left}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chiprow{display:flex;flex-direction:column;gap:5px}
.chiprow small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.list{overflow-y:auto;flex:1;min-height:0;padding-block:6px 20px}
.group-h{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px max(16px,env(safe-area-inset-left,0px))}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;color:var(--fg);font:14px/1.3 var(--f-body);padding:7px 16px 7px max(13px,calc(env(safe-area-inset-left,0px) - 3px));cursor:pointer}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft);border-left-color:var(--amber)}
.item small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .msg{font-family:var(--f-mono);font-size:10.5px;color:var(--ink);margin-left:4px}
.item .ai{font-family:var(--f-mono);font-size:10px;color:var(--ok);margin-left:4px}
.count{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.work{display:grid;grid-template-rows:minmax(320px,54%) minmax(0,1fr);min-height:0;min-width:0}
.stage{position:relative;min-width:0;min-height:0;background:var(--scene);border-bottom:1px solid var(--line);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none;line-height:1.5}
.tb{right:calc(14px + env(safe-area-inset-right,0px));top:12px;text-align:right;max-width:40%}
.hint{left:14px;bottom:10px;right:14px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.tools{position:absolute;z-index:5;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.tools button{font:500 12px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 9px;cursor:pointer}
.tools button:hover{border-color:var(--ink);color:var(--ink)}
.tools button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.tools button:disabled{opacity:.45;cursor:default}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;font:500 11px/1.2 var(--f-mono);color:#fff;background:var(--amber);padding:3px 6px;border-radius:3px;white-space:nowrap;margin-top:-6px}
.tag::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--amber)}
:root[data-theme="dark"] .tag{color:#1a1206}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#1a1206}}

.detail{overflow-y:auto;min-height:0;padding-block:20px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.sheet{max-width:900px;display:flex;flex-direction:column;gap:18px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.lead{margin:0;max-width:72ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font:600 11.5px var(--f-body);letter-spacing:.03em;padding:3px 8px;border-radius:3px;border:1px solid currentColor}
.pill.stop{color:var(--stop)} .pill.warn{color:var(--warn)} .pill.ok{color:var(--ok)} .pill.info{color:var(--muted)}
.pill.hmi{color:var(--ink);font-family:var(--f-mono);font-weight:500;letter-spacing:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 28px}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk h3{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.blk h3 em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em;text-transform:none;margin-left:6px}
.blk ul,.blk ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.blk li{max-width:68ch}
.blk ol li::marker{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.note{font-size:13px;border-left:2px solid var(--amber);padding:2px 0 2px 10px;max-width:72ch}
.note.err{border-left-color:var(--warn)}
.note.danger{border-left-color:var(--stop)}
.note b{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted);display:block}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .what{flex:1 1 220px;min-width:0}
.act .fix{flex:1 1 220px;min-width:0;color:var(--muted)}
.act .area{font:600 10px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);border:1px solid currentColor;border-radius:3px;padding:0 5px;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover{opacity:.9;color:var(--panel)}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--stop)}
textarea{width:100%;min-height:140px;font:12.5px/1.45 var(--f-mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px}
.iot{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.iot th{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.iot td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.iot td.tg{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.iot td.ds{font-family:var(--f-mono);font-size:11.5px}
.iot td.mn{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.iot .ty{font:600 10px var(--f-body);letter-spacing:.04em;padding:1px 5px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.iot .ty.DI,.iot .ty.AI,.iot .ty.TC{color:var(--ok)} .iot .ty.DO,.iot .ty.AO{color:var(--amber)}
.iot tr.lnk{cursor:pointer} .iot tr.lnk:hover td{background:var(--soft)}
.iot.bom tr.on td{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.tblwrap{overflow-x:auto;max-width:100%}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 16px;font-size:13.5px;margin:0}
.kv dt{font-family:var(--f-mono);font-size:12px;color:var(--muted)} .kv dd{margin:0;min-width:0}
.ends{font-size:13.5px;color:var(--fg);background:var(--soft);border-radius:4px;padding:8px 12px}
.ends b{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;color:var(--muted);margin-right:6px}
@media (max-width:600px){.iot .hidem{display:none}}
.balloon{position:absolute;transform:translate(-50%,-115%);display:flex;align-items:center;gap:5px;font:600 11px/1 var(--f-mono);color:var(--fg);background:var(--panel);border:2px solid var(--amber);border-radius:999px;padding:2px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.balloon b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;font-weight:600;padding:0 3px}
.balloon span{display:none;font-weight:500;padding-right:7px;font-size:10.5px}
.exnames .balloon span,.balloon:hover span,.balloon.on span{display:inline}
.balloon.on{background:var(--amber);color:#fff;z-index:3}
.nolabels .balloon,.nolabels .tag{display:none!important}
#cabsel{position:sticky;top:0;z-index:2;background:var(--bg);max-height:46vh;overflow:auto;border-bottom:1px solid var(--line);padding:12px 0 8px;margin-top:-12px}
.cabsel h3{font-family:var(--f-mono)}
.extools{display:none}
.exmode .extools{display:flex} .exmode .maintools,.exmode .tb,.exmode .tag{display:none!important}
.extools label{font:500 12px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:3px 8px;display:flex;align-items:center;gap:6px}
.extools input[type=range]{width:110px;accent-color:var(--amber)}
.work.full{grid-template-rows:minmax(320px,1fr) 0} .work.full .detail{display:none}
@media (max-width:900px){.work.full .stage{height:82vh}}
.exbtns{display:flex;flex-wrap:wrap;gap:6px}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:76ch}
/* setup */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
.form label.wide{grid-column:1/-1}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--panel)}
.drop.over{border-color:var(--ink);background:var(--soft)}
.drop p{margin:0;max-width:64ch}
.files select{padding:4px 6px;font-size:12.5px;width:auto;max-width:100%}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps label{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.steps small{color:var(--muted)}
.log{font:12px/1.5 var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.log .ok{color:var(--ok)} .log .err{color:var(--stop)} .log .run{color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat div{border:1px solid var(--line);border-radius:4px;padding:6px 10px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

@media (max-width:900px){
  .app{display:flex;flex-direction:column;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:42vh}
  .work{display:flex;flex-direction:column}
  .stage{height:54vh}
  .detail{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tb{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;font:500 13px var(--f-body);color:var(--panel);background:var(--fg);padding:9px 14px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (display-mode: standalone){.rail-head{padding-top:max(18px,env(safe-area-inset-top,0px))}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="idrow">
        <div>
          <div class="eyebrow" id="mEyebrow">The Troubleshooter</div>
          <h1 id="mName">Machine</h1>
        </div>
        <button class="setupbtn" type="button" data-key="setup" id="setupBtn">Setup &amp; sources</button>
      </div>
      <label class="mpick" id="mPickWrap" hidden><span>Machine</span><select id="mPick" aria-label="Choose a machine"></select></label>
      <span class="example" id="exampleFlag" hidden>Example data · replace with your documents</span>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="machine" aria-selected="true">Machine</button>
        <button role="tab" data-tab="process" aria-selected="false">Process</button>
        <button role="tab" data-tab="defects" aria-selected="false">Defects</button>
      </div>
      <input type="search" id="q" placeholder="Search faults, causes, parts" aria-label="Search">
      <div class="chips" id="cats"></div>
      <div class="count" id="count"></div>
    </div>
    <nav class="list" id="list" aria-label="Index"></nav>
  </aside>

  <main class="work">
    <div class="stage" id="stage">
      <div class="tools extools">
        <button id="exBack" type="button">← Machine</button>
        <label>Explode <input type="range" id="exT" min="0" max="100" value="75" aria-label="Explode amount"></label>
        <button id="exLabels" type="button" aria-pressed="true">Labels on</button>
        <button id="exNames" type="button" aria-pressed="false">Show names</button>
        <button id="exReset" type="button">Reset view</button>
        <button id="exFull" type="button" aria-pressed="false">Expand</button>
      </div>
      <div class="tools maintools">
        <button id="mainLabels" type="button" aria-pressed="true">Labels on</button>
        <button id="resetView" type="button">Reset view</button>
        <button id="doors" type="button">Hide guards</button>
        <button id="viewBack" type="button">Rear view</button>
      </div>
      <div class="overlay tb" id="tb"></div>
      <div class="overlay hint">Tap a part for its exploded view and faults · drag to orbit · pinch or scroll to zoom</div>
    </div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>
</div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>window.MTB_LIB="./";</script>
<script>
(function(){
"use strict";
/* ============================ DEFECT LIBRARY (general industry practice) ============================
   [name, category, what it looks like, isolate-first steps, [[area, cause, corrective action]], parameters to review, component keywords] */
const LIB=[
{id:'im',name:'Injection molding',materials:['Plastic'],match:/injection|mold(ing)?\b|moulding|thermoplastic/i,defects:[
 ['Short shot','Fill','Part is incomplete; thin sections, ribs or far-from-gate areas are missing.',['Check the cushion: zero cushion means not enough material or a leaking check ring','Run a fill study (short by 5% steps) to see the flow front','Compare with a known-good shot weight'],

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'x';
const arr=a=>Array.isArray(a)?a:(a==null||a===''?[]:[a]);
const str=s=>s==null?'':String(s);
const num=(v,d)=>{const n=+v;return isFinite(n)?n:d;};
const stageEl=id=>document.getElementById(id);

const GEOT=['box','cyl','cone','sphere','torus','tube','extrude','lathe'];
const nums=(a,n)=>{a=arr(a).map(v=>num(v,NaN)); return a.length>=n&&a.slice(0,n).every(isFinite)?a.slice(0,n):null;};
function cleanPrim(g){ if(!g||typeof g!=='object') return null; const t=g.t==='cylinder'?'cyl':g.t; if(!GEOT.includes(t)) return null;
  const o={t,p:nums(g.p,3)||[0,0,0]}; const r=nums(g.rot,3); if(r&&r.some(v=>v)) o.rot=r; if(g.c) o.c=str(g.c); if(g.glass) o.glass=1; if(g.guard) o.guard=1; if(g.edges===false) o.edges=false; if(+g.op>0&&+g.op<1) o.op=+g.op; if(g.nox) o.nox=1; {const sc=nums(g.sc,3); if(sc&&sc.every(v=>v>0)) o.sc=sc;} if(g.exo) o.exo=1;
  if(/^[xyz]$/.test(g.axis)) o.axis=g.axis; if(isFinite(+g.seg)) o.seg=Math.max(3,Math.min(96,+g.seg));
  const pts2=a=>arr(a).map(q=>nums(q,2)).filter(Boolean);
  if(t==='box'){o.s=nums(g.s,3); if(!o.s) return null;}
  else if(t==='cyl'||t==='cone'){o.r=num(g.r,0); o.r2=num(g.r2,t==='cone'?0:o.r); o.l=num(g.l,0); if(!(o.l>0)||!(o.r>=0)) return null; if(isFinite(+g.ri)&&+g.ri>0) o.ri=+g.ri;}
  else if(t==='sphere'){o.r=num(g.r,0); if(!(o.r>0)) return null; const sc=nums(g.sc,3); if(sc) o.sc=sc; if(isFinite(+g.cut)) o.cut=+g.cut;}
  else if(t==='torus'){o.R=num(g.R,0); o.tube=num(g.tube,0); if(!(o.R>0&&o.tube>0)) return null; if(isFinite(+g.arc)) o.arc=+g.arc;}
  else if(t==='tube'){o.pts=arr(g.pts).map(q=>nums(q,3)).filter(Boolean); o.r=num(g.r,10); if(o.pts.length<2) return null; if(g.closed) o.closed=1;}
  else if(t==='extrude'){o.pts=pts2(g.pts); o.depth=num(g.depth,10); o.plane=/^(xz|xy|yz)$/.test(g.plane)?g.plane:'xz'; if(o.pts.length<3) return null; if(+g.bevel>0) o.bevel=+g.bevel; const h=arr(g.holes).map(pts2).filter(x=>x.length>=3); if(h.length) o.holes=h;}
  else if(t==='lathe'){o.pts=pts2(g.pts); if(o.pts.length<2) return null;}

function normalize(raw){
  const p=JSON.parse(JSON.stringify(raw||{}));
  p.meta=Object.assign({name:'Untitled machine',maker:'',model:'',serial:'',functions:[],materials:[],summary:''},p.meta||{});
  p.meta.functions=arr(p.meta.functions).map(str).filter(Boolean); p.meta.materials=arr(p.meta.materials).map(str).filter(Boolean);
  p.groups=arr(p.groups).map(g=>typeof g==='string'?{id:slug(g),name:g}:{id:slug(g.id||g.name),name:str(g.name||g.id)}).filter(g=>g.name);
  const seen=new Set();
  p.components=arr(p.components).filter(c=>c&&(c.name||c.id)).map(c=>{let id=slug(c.id||c.name); while(seen.has(id)) id+='-2'; seen.add(id);
    const b=arr(c.box).map(v=>num(v,NaN)); const box=b.length===6&&b.every(isFinite)?b:null;
    return {id,name:str(c.name||c.id),group:c.group?slug(c.group):'',shape:SHAPES.includes(c.shape)?c.shape:'box',axis:/^[xyz]$/.test(c.axis)?c.axis:'',color:str(c.color),box,desc:str(c.desc),src:str(c.src),

  const cids=new Set(p.components.map(c=>c.id));
  const fix=ids=>arr(ids).map(x=>slug(x)).filter(x=>cids.has(x));
  const gids=new Set(p.groups.map(g=>g.id));
  p.components.forEach(c=>{if(c.group&&!gids.has(c.group)){p.groups.push({id:c.group,name:c.group.replace(/-/g,' ')});gids.add(c.group);}});
  const fseen=new Set();

    return {id,title:str(f.title||f.name),group:g,code:str(f.code),effect:/stop|warn|info/.test(f.effect)?f.effect:'',msg:str(f.msg),causes:arr(f.causes).map(str),checks:arr(f.checks).map(str),comps:fix(f.comps),io:arr(f.io).map(str),src:str(f.src),safety:str(f.safety)};});

  p.io=arr(p.io).filter(r=>r&&r.tag).map(r=>({tag:str(r.tag),type:/^(DI|DO|AI|AO|TC)$/i.test(r.type)?r.type.toUpperCase():str(r.type||'').toUpperCase().slice(0,4),desc:str(r.desc),addr:str(r.addr),device:str(r.device),loc:str(r.loc),sheet:str(r.sheet),wire:str(r.wire)}));

  const sq=new Set();
  p.sequence=arr(p.sequence).filter(s=>s&&s.name).map(s=>{let id=slug(s.id||s.name);while(sq.has(id)) id+='-2';sq.add(id);return {id,name:str(s.name),desc:str(s.desc),ends:str(s.ends),inputs:arr(s.inputs).map(str),outputs:arr(s.outputs).map(str),comps:fix(s.comps),hw:arr(s.hw).map(str)};});

  else if(it.t==='defect'){detail.innerHTML=renderDefect(it.o); ids=it.o.comps; want='defects';}

  else if(t==='causes') obj[k]=str(v).split(/\r?\n/).map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.join('')).map(a=>a.length>=3?{area:a[0].toLowerCase()||'machine',cause:a[1],fix:a.slice(2).join(' | ')}:{area:'machine',cause:a[0],fix:a[1]||''});

function profileFromWorkbook(X,wb){

function checkRefs(raw){
  const w=[]; const cids=new Set(arr(raw.components).map(c=>slug(c.id||c.name))); const tags=new Set(arr(raw.io).map(r=>str(r.tag)));
  const chk=(where,ids)=>arr(ids).forEach(i=>{if(!cids.has(slug(i))) w.push(`${where}: component "${i}" is not on the Components sheet`);});
  const chkIo=(where,ts)=>{if(!tags.size) return; arr(ts).forEach(t=>{if(!tags.has(str(t))) w.push(`${where}: I/O tag "${t}" is not on the IO sheet`);});};
  arr(raw.faults).forEach(f=>{chk('Fault "'+(f.title||f.id)+'"',f.comps); chkIo('Fault "'+(f.title||f.id)+'"',f.io);});
  arr(raw.sequence).forEach(s=>{chk('Sequence "'+s.name+'"',s.comps); chkIo('Sequence "'+s.name+'"',[...arr(s.inputs),...arr(s.outputs)]);});
  arr(raw.checks).forEach(s=>chk('Check "'+s.name+'"',s.comps));
  arr(raw.defects).forEach(s=>chk('Defect "'+s.name+'"',s.comps));
  Object.entries(raw.cabinets||{}).forEach(([k,c])=>{if(!cids.has(slug(k))) w.push(`Cabinet devices: cabinet "${k}" is not on the Components sheet`); arr(c.devices).forEach(d=>chkIo('Device '+d.tag,d.io));});
  arr(raw.components).forEach(c=>{if(!c.box) w.push(`Component "${c.name||c.id}" has no position, so it is placed beside the machine`);});
  return w;
}

let pdfjsReady=null;
function loadPdfjs(){

async function pageImage(e,i){
  const pg=await e.pdf.getPage(i); const vp0=pg.getViewport({scale:1}); const sc=Math.min(2.2,1800/Math.max(vp0.width,vp0.height)); const vp=pg.getViewport({scale:sc});

function excerpt(kinds,re,budget,perPage){

  pick.sort((a,b)=>a.f===b.f?a.i-b.i:FILES.indexOf(a.f)-FILES.indexOf(b.f));

    if(go){try{await openLibMachine(go);}catch(e){saveState='Could not load '+go.file+': '+e.message;}}
    renderPicker();
    setTimeout(()=>MLIB.forEach(x=>fetch(x.file,{cache:'no-cache'}).catch(()=>{})),4000); // warm the offline cache for every machine
  } else if(!window.claude){ // hosted outside claude.ai (e.g. GitHub Pages): load profile.json published next to the page
    try{const r=await fetch('profile.json',{cache:'no-cache'}); if(r.ok){const raw=await r.json(); let local=null; try{local=localStorage.getItem('mtb-profile');}catch(e){}
      if(!local&&raw&&(raw.meta||raw.components)){raw.example=false; applyProfile(raw,true); saveState='Loaded profile.json from this site.';}}}catch(e){}
  }
  rerenderSetup();
})();
})();
</script>

<div class="toast" id="appToast" role="status" hidden></div>
<script>
(function(){
  var btn=document.createElement('button'); btn.type='button'; btn.className='setupbtn'; btn.id='installBtn'; btn.textContent='Install app'; btn.hidden=true;
  var row=document.querySelector('.idrow'); if(row) row.appendChild(btn);
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault(); deferred=e; btn.hidden=false;});
  btn.addEventListener('click',function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){deferred=null; btn.hidden=true;}); });
  window.addEventListener('appinstalled',function(){btn.hidden=true; toast('The Troubleshooter is installed');});
  function toast(t){var el=document.getElementById('appToast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){el.hidden=true;},4000);}
  window.addEventListener('offline',function(){toast('Offline: showing the saved copy');});
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    var had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange',function(){ if(had) toast('Updated to the latest version. Reopen the app to use it.'); });
  }
})();
</script>
